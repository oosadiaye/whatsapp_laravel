# BlastIQ Reverb WebSocket proxy for APACHE (httpd). Use this when the server
# runs Apache instead of nginx. (nginx users: see deploy/nginx.conf.)
#
# Public WSS at https://<your-domain>/app is proxied to the local Reverb daemon
# on 127.0.0.1:8081 (8080 is commonly held by Docker's docker-proxy).
#
# ── Required Apache modules (RHEL httpd) ──────────────────────────────────────
#   proxy, proxy_http, proxy_wstunnel, rewrite
#   Confirm they're loaded:   sudo httpd -M | grep -E 'proxy_module|proxy_http|proxy_wstunnel|rewrite'
#   If proxy_wstunnel is missing:
#     echo 'LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so' \
#       | sudo tee /etc/httpd/conf.modules.d/00-proxy-wstunnel.conf
#     sudo systemctl restart httpd
#
# ── Install ──────────────────────────────────────────────────────────────────
#   Paste the block below INSIDE the HTTPS (*:443) <VirtualHost> for your domain,
#   then:  sudo apachectl configtest && sudo systemctl reload httpd
#   (Using a control panel? Add it via the panel's Apache "Include" / custom-
#    directives feature — proxy rules can't live in .htaccess reliably.)
#
# ==============================================================================
#   <VirtualHost *:443>
#       ServerName blast.dpluxtech.com
#       ... your existing SSL + Laravel DocumentRoot config ...

    # --- Reverb WebSocket proxy ---
    RewriteEngine On

    # WebSocket upgrade requests -> Reverb over ws://
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?app/(.*)$ ws://127.0.0.1:8081/app/$1 [P,L]

    # Non-upgrade /app requests (transport fallback) -> Reverb over http://
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/?app/(.*)$ http://127.0.0.1:8081/app/$1 [P,L]

    ProxyPassReverse /app http://127.0.0.1:8081/app

#   </VirtualHost>
# ==============================================================================
