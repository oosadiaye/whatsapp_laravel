<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a7f50">
  <title>You are offline · BlastIQ</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f6f7f6; color: #14201a; }
    main { max-width: 22rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    h1 { font-size: 1.35rem; margin: 20px 0 8px; }
    p { margin: 0 0 22px; line-height: 1.5; color: #4b5a52; }
    button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 10px; background: #0a7f50; color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { background: #0c1511; color: #e8f1ec; } p { color: #9db0a5; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>You are offline</h1>
    <p>BlastIQ needs an internet connection for messages, calls and email. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
